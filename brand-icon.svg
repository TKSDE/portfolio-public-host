<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for high contrast on dark & light browser tabs -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Left Shield Blue Gradient -->
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Right Shield Emerald Gradient -->
    <linearGradient id="shieldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shackle Metallic Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-contrast rounded squircle container -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#borderGlow)" stroke-width="8" stroke-opacity="0.85" />

  <g filter="url(#shieldShadow)" transform="translate(0, 10)">
    <!-- 1. Metallic Padlock Shackle -->
    <path d="M190 200 V140 C190 95, 322 95, 322 140 V200" 
          fill="none" 
          stroke="url(#shackleGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- 2. Left Shield Body (Electric Blue) -->
    <path d="M256 180 H140 C140 280, 200 375, 256 420 Z" 
          fill="url(#shieldBlue)" />

    <!-- 3. Right Shield Body (Cyber Emerald with Circuit Outline) -->
    <path d="M256 180 H372 C372 280, 312 375, 256 420 Z" 
          fill="url(#shieldGreen)" />

    <!-- 4. Circuit Traces & Nodes on Right Side -->
    <g stroke="#ffffff" stroke-width="8" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <!-- Circuit Path 1 -->
      <path d="M280 230 H330 L350 250" fill="none" />
      <circle cx="350" cy="250" r="10" />

      <!-- Circuit Path 2 -->
      <path d="M285 280 H345 L360 295" fill="none" />
      <circle cx="360" cy="295" r="10" />

      <!-- Circuit Path 3 -->
      <path d="M275 330 H320 L335 345" fill="none" />
      <circle cx="335" cy="345" r="9" />

      <!-- Circuit Path 4 -->
      <path d="M265 375 L295 390" fill="none" />
      <circle cx="295" cy="390" r="8" />
    </g>

    <!-- 5. Left Side Modern Circuit Grooves -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M230 230 H180 L165 245" />
      <circle cx="165" cy="245" r="8" fill="#ffffff" />
      <path d="M225 285 H170 L155 300" />
      <circle cx="155" cy="300" r="8" fill="#ffffff" />
      <path d="M235 340 H190 L180 350" />
      <circle cx="180" cy="350" r="7" fill="#ffffff" />
    </g>

    <!-- 6. Central Glowing Security Keyhole -->
    <!-- Keyhole Circle -->
    <circle cx="256" cy="275" r="26" fill="#ffffff" />
    <!-- Keyhole Stem -->
    <polygon points="244,275 268,275 274,325 238,325" fill="#ffffff" />

    <!-- Center dividing seam -->
    <line x1="256" y1="180" x2="256" y2="249" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
    <line x1="256" y1="325" x2="256" y2="420" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  </g>
</svg>